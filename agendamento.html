<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agendamento | Tommixbarber</title>
<style>
:root{--bg:#0a0a0c;--card:#141418;--text:#f5f3ee;--muted:#aaa7a1;--gold:#c99b4a;--gold2:#f0c36e;--line:rgba(255,255,255,.1)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#241b0e,#0a0a0c 38%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh}.wrap{width:min(760px,92%);margin:auto;padding:36px 0 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:34px}.brand{font-size:1.25rem;font-weight:900}.brand span{color:var(--gold2)}a{color:inherit;text-decoration:none}.back{color:#d7d3cc}.card{background:rgba(20,20,24,.95);border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 18px 50px rgba(0,0,0,.25)}.tag{display:inline-block;color:var(--gold2);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800}h1{font-size:clamp(2.2rem,7vw,4rem);line-height:1;margin:10px 0 12px;letter-spacing:-.04em}p{color:var(--muted)}form{display:grid;gap:18px;margin-top:30px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:grid;gap:7px;font-size:.9rem;font-weight:750}input,select{width:100%;border:1px solid var(--line);background:#0e0e12;color:var(--text);border-radius:12px;padding:14px;font:inherit;outline:none}input:focus,select:focus{border-color:var(--gold)}button{border:0;border-radius:13px;padding:15px 20px;font:inherit;font-weight:900;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#171109;cursor:pointer}.note{font-size:.86rem;color:var(--muted);margin-top:16px}.status{min-height:1.5em;font-size:.9rem;color:#f0c36e}@media(max-width:620px){.grid{grid-template-columns:1fr}.card{padding:22px}.top{align-items:flex-start;flex-direction:column}}</style>
</head>
<body><div class="wrap">
<div class="top"><a class="brand" href="index.html">Tommix<span>barber</span></a><a class="back" href="index.html">← Voltar ao site</a></div>
<div class="card"><div class="tag">Agendamento</div><h1>Escolha seu horário.</h1><p>Preencha os dados abaixo. Ao continuar, o WhatsApp da Tommixbarber será aberto com a solicitação pronta para confirmação.</p>
<form id="booking">
<div class="grid"><label>Seu nome<input id="name" type="text" required placeholder="Como podemos te chamar?"></label><label>Serviço<select id="service" required><option value="">Selecione</option><option>Corte</option><option>Barba</option><option>Corte + barba</option><option>Corte infantil</option><option>Outro serviço</option></select></label></div>
<div class="grid"><label>Data<input id="date" type="date" required></label><label>Horário<input id="time" type="time" required min="08:00" max="20:00"></label></div>
<label>Observação (opcional)<input id="notes" type="text" placeholder="Ex.: preferência de corte"></label>
<div class="status" id="status" aria-live="polite"></div><button type="submit">Solicitar horário pelo WhatsApp</button>
</form><div class="note">O horário só fica confirmado após a resposta da barbearia no WhatsApp. Telefone: (73) 98868-1704.</div></div>
</div>
<script>
const form=document.getElementById('booking'),date=document.getElementById('date'),status=document.getElementById('status');
const today=new Date(); const y=today.getFullYear(),m=String(today.getMonth()+1).padStart(2,'0'),d=String(today.getDate()).padStart(2,'0'); date.min=`${y}-${m}-${d}`;
form.addEventListener('submit',e=>{e.preventDefault();const name=document.getElementById('name').value.trim(),service=document.getElementById('service').value,day=date.value,time=document.getElementById('time').value,notes=document.getElementById('notes').value.trim();if(!name||!service||!day||!time){status.textContent='Preencha nome, serviço, data e horário.';return}const [yy,mm,dd]=day.split('-');const pretty=`${dd}/${mm}/${yy}`;const msg=`Olá, Tommixbarber! Gostaria de solicitar um agendamento.%0A%0A👤 Nome: ${encodeURIComponent(name)}%0A✂️ Serviço: ${encodeURIComponent(service)}%0A📅 Data: ${encodeURIComponent(pretty)}%0A🕒 Horário: ${encodeURIComponent(time)}${notes?`%0A📝 Observação: ${encodeURIComponent(notes)}`:''}%0A%0APode confirmar a disponibilidade?`;window.open(`https://wa.me/5573988681704?text=${msg}`,'_blank','noopener');status.textContent='Abrindo o WhatsApp para confirmar o horário…';});
</script></body></html>
